services:
  app_proxy:
    environment:
      APP_HOST: errahmounispace-openchamber_server_1
      APP_PORT: 3000

  server:
    # Published to GHCR; anonymous pull verified on 2026-10-25.
    # amd64 only. Do not replace this with a moving/latest image.
    image: ghcr.io/abdelhamiderrahmouni/openchamber:2.5.1-umbrel.1@sha256:49166477b91d4050fe73f04caec59717e3153dc544065eb13a424d5658b2ce40
    platform: linux/amd64
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      OPENCHAMBER_HOST: 0.0.0.0
      OPENCHAMBER_UI_PASSWORD: ${APP_PASSWORD:?Umbrel must provide the app password}
      OH_MY_OPENCODE: "false"
    ports:
      # Opted-in LAN preview access: bypasses app_proxy and its authentication.
      # Do not forward these ports to the internet. Dev servers bind 0.0.0.0.
      - "5100-5119:5100-5119/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/openchamber:/home/openchamber/.config/openchamber
      - ${APP_DATA_DIR}/data/opencode/share:/home/openchamber/.local/share/opencode
      - ${APP_DATA_DIR}/data/opencode/state:/home/openchamber/.local/state/opencode
      - ${APP_DATA_DIR}/data/opencode/config:/home/openchamber/.config/opencode
      - ${APP_DATA_DIR}/data/ssh:/home/openchamber/.ssh
      - ${APP_DATA_DIR}/data/workspaces:/home/openchamber/workspaces
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/health'); const h = await r.json(); if (!r.ok || !h.isOpenCodeReady) process.exit(1);"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
